{
  "name": "shell-game",
  "services": {
    "scoreboard": {
      "image": "frostbyte:local",
      "command": [
        "scoreboard"
      ],
      "init": true,
      "restart": "unless-stopped",
      "read_only": true,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "NET_RAW"
      ],
      "pids_limit": 128,
      "mem_limit": "256m",
      "cpus": "1.0",
      "ports": [
        "${SSH_BIND:-0.0.0.0}:2200:22",
        "${SCORE_BIND:-127.0.0.1}:8080:8080"
      ],
      "tmpfs": [
        "/run:rw,nosuid,nodev,size=16m",
        "/tmp:rw,nosuid,nodev,size=32m,mode=1777"
      ],
      "volumes": [
        "scoreboard-state:/var/lib/frost",
        "scoreboard-home:/home/player",
        "./secrets/scoreboard/shadow:/run/bootstrap/shadow:ro",
        "./secrets/scoreboard/authorized_keys:/run/bootstrap/authorized_keys:ro",
        "./secrets/scoreboard/tokens.json:/run/bootstrap/score_tokens:ro"
      ],
      "networks": [
        "lane01",
        "lane02",
        "lane03",
        "lane04",
        "lane05",
        "lane06",
        "lane07",
        "lane08",
        "lane09",
        "lane10",
        "lane11",
        "lane12",
        "lane13",
        "lane14",
        "lane15",
        "lane16",
        "lane17",
        "lane18",
        "lane19",
        "lane20",
        "lane21",
        "lane22",
        "lane23"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      },
      "build": {
        "context": "."
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=2)"
        ],
        "interval": "10s",
        "timeout": "3s",
        "retries": 3
      }
    },
    "player01": {
      "image": "frostbyte:local",
      "command": [
        "player"
      ],
      "init": true,
      "restart": "unless-stopped",
      "read_only": true,
      "security_opt": [
        "no-new-privileges:true"
      ],
      "cap_drop": [
        "NET_RAW"
      ],
      "pids_limit": 96,
      "mem_limit": "256m",
      "cpus": "0.50",
      "ports": [
        "${SSH_BIND:-0.0.0.0}:2201:22"
      ],
      "tmpfs": [
        "/run:rw,nosuid,nodev,size=16m",
        "/tmp:rw,nosuid,nodev,size=32m,mode=1777"
      ],
      "volumes": [
        "player01-state:/var/lib/frost",
        "player01-home:/home/player",
        "./secrets/player01/shadow:/run/bootstrap/shadow:ro",
        "./secrets/player01/authorized_keys:/run/bootstrap/authorized_keys:ro",
        "./secrets/player01/token:/run/bootstrap/score_token:ro"
      ],
      "networks": [
        "lane01"
      ],
      "logging": {
        "driver": "json-file",
        "options": {
          "max-size": "5m",
          "max-file": "2"
        }
      },
      "environment": {
        "SCORE_URL": "http://scoreboard:8080"
      },
      "depends_on": {
        "scoreboard": {
          "condition": "service_healthy"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python3",
          "-c",
          "from frost.client import request; request()"
        ],
        "interval": "15s",
        "timeout": "4s",
        "retries": 3,
        "start_period": "10s"
      }
    },
