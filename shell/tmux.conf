set -g default-terminal 'tmux-256color'
set -g history-limit 10000
set -g mouse off
set -g status on
set -g status-interval 2
set -g status-style 'bg=#101b2c,fg=#8cabc4'
set -g status-left-length 35
set -g status-left '#[fg=#5de2d0]╰── ❄ FROSTBYTE '
set -g status-right '#[fg=#8cabc4] ls · cp · cd · ~/rucksack/funke   ──╯'
set -g pane-border-style 'fg=#243d53'
set -g pane-active-border-style 'fg=#5de2d0'
set -g pane-border-status top
set -g pane-border-format '#[fg=#8cabc4] #{pane_title} '
set -g pane-border-lines single
set -g automatic-rename off
set -g allow-rename off
set -g escape-time 10
